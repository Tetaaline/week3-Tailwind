<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Profile Card</title>
</head>

<body>

    <div class="max-w-sm mx-auto bg-white rounded-2xl shadow-lg p-6 text-center
                hover:shadow-xl transition-shadow">

        <img src="profile/pfp.jpeg"
             alt="Profile picture of Teta Aline"
             class="size-24 rounded-full mx-auto mb-4 ring-4 ring-emerald-100" />

        <h2 class="text-xl font-semibold text-slate-800">
            Teta Aline
        </h2>

        <p class="text-sm text-slate-500 mb-4">
            Frontend Developer · Kigali
        </p>

        <p class="text-slate-600 leading-relaxed mb-6">
            I build accessible, responsive websites and love clean design systems.
        </p>

        <span class="inline-block text-xs px-2 py-1 rounded-full
                     bg-emerald-100 text-emerald-700 mr-1">
            HTML & CSS
        </span>

        <span class="inline-block text-xs px-2 py-1 rounded-full
                     bg-emerald-100 text-emerald-700">
            JavaScript
        </span>

        <br><br>

        <a href="#"
           class="inline-block bg-emerald-600 text-white font-medium px-5 py-2 rounded-lg
                  hover:bg-emerald-700 transition-colors
                  focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
            Contact me
        </a>

    </div>
    <div class="bg-amber-100 text-amber-800 px-6 py-4 border-l-4 border-amber-500 rounded-lg font-medium mt-8">
    This is a Tailwind notice.
    </div>
    <div class="max-w-xs mx-auto mt-8 bg-white rounded-xl border border-slate-200 p-6">

    <h2 class="text-xl font-bold text-slate-800">
        Basic Plan
    </h2>

    <p class="text-4xl font-bold text-emerald-600 mt-4">
        $10
        <span class="text-sm font-normal text-slate-500">/month</span>
    </p>

    <ul class="space-y-2 mt-6 text-slate-600">
        <li>✓ Responsive design</li>
        <li>✓ Basic support</li>
        <li>✓ 5 projects</li>
        <li>✓ 10 GB storage</li>
    </ul>

    <button
        class="w-full mt-6 bg-emerald-600 text-white font-medium py-2 rounded-lg
               hover:bg-emerald-700 transition-colors
               focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-emerald-400">
        Choose Plan
    </button>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Layout Gym</title>
</head>

<body class="bg-gray-100 p-6">

    <!-- Exercise 1: Nine positions -->
    <section class="mb-10">
        <h2 class="text-2xl font-bold mb-4 text-blue-800">Exercise 1: Nine Positions</h2>

        <div class="flex gap-4 overflow-x-auto">

            <div>
                <p class="text-sm font-semibold mb-2">Top Left</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-start justify-start p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

            <div>
                <p class="text-sm font-semibold mb-2">Top Center</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-start justify-center p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

            <div>
                <p class="text-sm font-semibold mb-2">Top Right</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-start justify-end p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

            <div>
                <p class="text-sm font-semibold mb-2">Center Left</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-center justify-start p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

            <div>
                <p class="text-sm font-semibold mb-2">Center</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-center justify-center p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

            <div>
                <p class="text-sm font-semibold mb-2">Center Right</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-center justify-end p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

            <div>
                <p class="text-sm font-semibold mb-2">Bottom Left</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-end justify-start p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

            <div>
                <p class="text-sm font-semibold mb-2">Bottom Center</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-end justify-center p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

            <div>
                <p class="text-sm font-semibold mb-2">Bottom Right</p>
                <div class="flex h-64 w-48 border border-blue-300 bg-blue-50 items-end justify-end p-2">
                    <div class="w-12 h-12 bg-blue-500"></div>
                </div>
            </div>

        </div>
    </section>

     <!-- Exercise 2: Navbar -->
    <section class="mb-10">
        <h2 class="text-2xl font-bold mb-4 text-green-800">Exercise 2: Navbar</h2>

        <nav class="flex items-center justify-between gap-6 bg-green-50 border border-green-300 p-4">

            <div class="font-bold text-xl text-green-900">
                MyLogo
            </div>

            <div class="flex gap-6">
                <a href="#" class="text-green-700 hover:text-green-900">Home</a>
                <a href="#" class="text-green-700 hover:text-green-900">About</a>
                <a href="#" class="text-green-700 hover:text-green-900">Services</a>
                <a href="#" class="text-green-700 hover:text-green-900">Contact</a>
            </div>

            <button
                class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-700 focus-visible:outline-2 focus-visible:outline-green-500">
                Sign up
            </button>

        </nav>
    </section>
